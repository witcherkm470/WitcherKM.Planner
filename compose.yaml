services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      additional_contexts:
        common: ../WitcherKM.Common
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/planner.db
    secrets:
      - source: mediatr_license_key
        target: MediatR__LicenseKey
    volumes:
      - planner-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  planner-data:

secrets:
  mediatr_license_key:
    file: ./secrets/MediatR__LicenseKey
